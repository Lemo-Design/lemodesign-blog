# Kamal deploy — Lemo Design blog on Hetzner `lemodesign`.
# Notion-backed Next.js (ISR). Coexists with other Kamal apps on this host.
#
# Secrets (`.kamal/secrets`, gitignored):
#   KAMAL_REGISTRY_PASSWORD=
#   NOTION_SECRET=
#   BLOG_DATABASE_ID=

service: lemodesign-blog
image: lemo-design/lemodesign-blog

servers:
  web:
    - 46.225.171.3

# Same SSH pattern as kifungo / remondevries: 1Password agent via SSH_AUTH_SOCK.
ssh:
  user: deploy
  config: false
  keys: []
  keys_only: false
  log_level: fatal

registry:
  server: ghcr.io
  username: remondevries
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .
  # Needed at image build time for getStaticProps / getStaticPaths (Notion).
  secrets:
    - NOTION_SECRET
    - BLOG_DATABASE_ID

env:
  clear:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
  secret:
    - NOTION_SECRET
    - BLOG_DATABASE_ID

proxy:
  ssl: true
  host: blog.lemo-design.com
  app_port: 3000
  forward_headers: true
  healthcheck:
    path: /up
    interval: 3
    timeout: 10
